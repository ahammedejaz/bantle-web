name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/assert-isolated-test-environment.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run scan:secrets
      - run: git diff --check
